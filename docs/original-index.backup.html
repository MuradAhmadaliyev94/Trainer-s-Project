<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Təlimçi Kabineti</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--card:#fff;--tx:#18203a;--mu:#667090;--ac:#7c3aed;--ac2:#f97316;--bd:#e3e7f2;--sh:0 8px 30px rgba(40,50,110,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1223;--card:#171d36;--tx:#eef1ff;--mu:#97a0c4;--ac:#a78bfa;--ac2:#fb923c;--bd:#262e52;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e1223;--card:#171d36;--tx:#eef1ff;--mu:#97a0c4;--ac:#a78bfa;--ac2:#fb923c;--bd:#262e52;--sh:0 8px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
select option{background:var(--card);color:var(--tx)}
.dk{color-scheme:dark}
.hero{position:relative;overflow:hidden;text-align:center;padding:64px 20px 150px;background:linear-gradient(135deg,#5b21b6,#c026d3 50%,#f97316);color:#fff}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.45;animation:fl 9s ease-in-out infinite}
.b1{width:260px;height:260px;background:#fbbf24;left:-60px;top:-60px}
.b2{width:300px;height:300px;background:#fb7185;right:-80px;bottom:-120px;animation-delay:-4s}
.b3{width:140px;height:140px;background:#34d399;left:55%;top:20px;animation-delay:-2s}
@keyframes fl{50%{transform:translate(30px,24px) scale(1.12)}}
.hero>.tag,.hero>h1,.hero>p{position:relative;z-index:2}
.fi{position:absolute;bottom:-70px;display:grid;place-items:center;border-radius:32%;border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;animation:rise linear infinite;z-index:1}
.fi .ic{margin:0;width:52%;height:52%;stroke:#fff;stroke-width:1.6}
@keyframes rise{0%{transform:translateY(0) rotate(-8deg);opacity:0}10%{opacity:1}50%{transform:translateY(-240px) rotate(8deg)}90%{opacity:1}100%{transform:translateY(-480px) rotate(-8deg);opacity:0}}
.scene{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;width:min(800px,100%);height:70px;z-index:1}
.st{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.arm{transform-origin:214px 48px;animation:wave 1.2s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-28deg)}}
.hand{transform-origin:520px 52px;animation:wave 1s ease-in-out infinite}
.tag{display:inline-block;padding:6px 16px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);font-size:14px;margin-bottom:18px}
h1{margin:0 auto;max-width:900px;font-size:clamp(42px,9vw,84px);font-weight:800;line-height:1.05;letter-spacing:-1.5px;text-shadow:0 6px 30px rgba(0,0,0,.25)}
.slogan{margin:16px auto 0!important;max-width:560px;font-size:clamp(14px,2.3vw,18px);font-weight:500;letter-spacing:.4px;opacity:.95}
.slogan b{font-weight:700;border-bottom:2px solid rgba(255,255,255,.55);padding-bottom:1px}
h1 span{background:linear-gradient(90deg,#fde68a,#fecdd3);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:560px;margin:16px auto 0;opacity:.9}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-top:-52px;position:relative}
.tc{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px 16px;text-align:center;cursor:pointer;box-shadow:var(--sh);transition:transform .25s,border-color .25s}
.tc:hover{transform:translateY(-8px) rotate(-1deg);border-color:var(--ac)}
.av{width:68px;height:68px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:28px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.tc b{display:block}.tc small{color:var(--mu)}
.av{overflow:visible}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:9px}.av svg{width:100%;height:100%;display:block;border-radius:50%}
.av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.tile img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.av.adm{box-shadow:0 0 0 3px #fbbf24,0 0 18px rgba(251,191,36,.6);animation:glow 2.5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px #fbbf24,0 0 30px rgba(251,191,36,.95)}}
.av svg .bd{transform-origin:32px 40px}
.tc:hover .av svg{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.badge{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:99px;background:rgba(79,70,229,.12);color:var(--ac);font-size:12px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}
.top h2{margin:0;font-size:24px}
.btn{border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-weight:600}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.r{background:#e5484d}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer;font-size:14px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tab i{font-style:normal;opacity:.7;margin-left:4px}
.lay{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.side{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:10px;box-shadow:var(--sh)}
.side .tab{border:0;border-radius:12px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;padding:11px 12px;transition:.2s}
.side .tab:hover{background:var(--bg)}
.side .tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.side .tab i{background:rgba(127,127,160,.2);padding:0 9px;border-radius:99px;opacity:1;margin:0;font-size:12px}
.side .tab.on i{background:rgba(255,255,255,.28)}
@media(max-width:700px){.lay{grid-template-columns:1fr}.side{position:static}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form>div:first-child{grid-column:1/-1}
.ds{display:flex;gap:6px}.ds select{padding:10px 6px;min-width:0}
.form .w{grid-column:1/-1}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--bd);animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.row>div{flex:1;min-width:0}.row small{color:var(--mu)}
.x{border:0;background:none;cursor:pointer;font-size:18px;color:var(--mu)}.x:hover{color:#e5484d}
.empty{text-align:center;color:var(--mu);padding:28px 0}
.dk{--bg:#0b0f1f;--card:#151b34;--tx:#eef1ff;--mu:#9aa3c7;--bd:#2a3358;--ac:#a78bfa;--ac2:#fb923c;background:radial-gradient(900px 400px at 15% -10%,#3b1f6b,transparent),radial-gradient(700px 400px at 100% 0,rgba(124,45,18,.6),transparent),#0b0f1f;color:var(--tx);border-radius:26px;padding:22px;box-shadow:var(--sh)}
.dk .panel{margin-top:16px}
.stage{text-align:center;padding:10px 0 14px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;color:#fecaca}
.live i{width:9px;height:9px;border-radius:50%;background:#ef4444;animation:pu 1.4s infinite}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}100%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:18px auto;max-width:700px}
.tile{position:relative;aspect-ratio:4/3;border-radius:16px;background:#0f1530;border:2px solid transparent;display:grid;place-items:center;animation:spk 6s infinite}
.tile svg{width:56px;height:56px;border-radius:50%}
.tile span{position:absolute;left:8px;bottom:6px;font-size:12px;background:rgba(0,0,0,.5);padding:1px 8px;border-radius:8px}
@keyframes spk{0%,60%,100%{border-color:transparent;box-shadow:none}10%,30%{border-color:#22c55e;box-shadow:0 0 18px rgba(34,197,94,.55)}}
.plats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:760px;margin:0 auto}
.pl{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;padding:14px 16px;border-radius:16px;text-align:left;transition:transform .2s}
.pl:hover{transform:translateY(-4px)}
.pl .ic{width:26px;height:26px;margin:0}
.pl small{display:block;opacity:.85}
.zm{background:#2d6cdf}.gm{background:#0f9d58}.tm{background:#5b5fc7}
.rb{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;padding:16px 20px;border-radius:20px;margin-bottom:16px;color:#fff;background:linear-gradient(120deg,#0b0f1f,#3b1f6b);box-shadow:var(--sh)}
.rb small{opacity:.8}
.rb .ic{vertical-align:-3px}
a.btn{text-decoration:none;display:inline-block}
.sdiv{height:1px;background:var(--bd);margin:6px 4px}
.side .tab.sp{padding:17px 14px;font-size:16px;font-weight:700;color:#fff;border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.2);margin-top:4px}
.side .tab.sp.rooms{background:linear-gradient(135deg,#5e5ce6,#bf5af2)}
.side .tab.sp.red{background:linear-gradient(135deg,#ff453a,#ff9f0a)}
.side .tab.sp.on{outline:3px solid color-mix(in srgb,var(--ac) 50%,transparent);outline-offset:2px}
.side .tab.sp i{background:rgba(255,255,255,.3);color:#fff}
.side .tab.sp:hover{filter:brightness(1.06)}
.panel.rm{padding:24px}
.panel.rm.rooms{background:linear-gradient(180deg,color-mix(in srgb,#bf5af2 12%,var(--card)),var(--card) 220px)}
.panel.rm.red{background:linear-gradient(180deg,color-mix(in srgb,#ff453a 12%,var(--card)),var(--card) 220px)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.rc{background:var(--card);border-radius:26px;padding:20px 18px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:9px;align-items:center;text-align:center;border:2px solid transparent;transition:border-color .3s,transform .25s}
.rc.busy{border-color:rgba(255,59,48,.4)}.rc.free{border-color:rgba(52,199,89,.4)}
.rc:hover{transform:translateY(-4px)}
.aic{width:88px;height:88px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.28));transition:transform .3s}
.rc:hover .aic{transform:scale(1.07)}
.rn{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.rn small{display:block;font-size:12px;font-weight:500;color:var(--mu);letter-spacing:0}
.rs{font-weight:700;font-size:14px}.rs.b{color:#ff3b30}.rs.f{color:#34c759}
.bl{width:100%;text-align:left}.bi{font-size:13px;padding:4px 0;border-top:1px solid var(--bd)}
.bf{background:color-mix(in srgb,var(--tx) 5%,transparent);border-radius:22px;padding:18px;margin-bottom:16px}
.vw{display:grid;gap:16px}
.vd{border-radius:22px;padding:20px;color:#fff}
.vd.dig{background:linear-gradient(135deg,#312e81,#7c3aed 60%,#ec4899)}
.vd.mis{background:linear-gradient(135deg,#9a3412,#f97316 60%,#facc15)}
.vh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}.vh h3{margin:0;font-size:22px}.vh small{opacity:.92}
.vg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bt{background:#fff;color:#111827;border:0;border-radius:16px;padding:20px 10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.bt:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 12px 26px rgba(0,0,0,.28)}
.bt small{color:#64748b;font-size:12px}
.wm{font-weight:800;font-size:22px;letter-spacing:1.5px;text-transform:uppercase}.wm.big{font-size:28px}
.pill{background:#fff;padding:6px 18px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.dt{width:50px;height:54px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}.dt b{font-size:20px;line-height:1}.dt small{font-size:11px;opacity:.9}
.ezw{margin:6px 0 16px}
.ezm{display:grid;grid-template-columns:1fr 275px;gap:14px;align-items:start;margin-top:6px}
.mapc{position:relative;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:4px}
.mscroll{overflow:auto;max-height:620px;border-radius:14px}
.mapc svg{display:block;height:auto;max-width:none}
.mz{position:absolute;top:10px;right:14px;z-index:3;display:flex;flex-direction:column;gap:6px}
.mz button{width:34px;height:34px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:#111;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.rg{fill:#fff;stroke:#94a3b8;stroke-width:.9;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .25s}
.rg.off:hover{fill:#e0f2fe}
.rg.on{fill:#22c55e}.rg.on:hover{fill:#16a34a}
.ob{fill:none;stroke:#334155;stroke-width:1.6;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.mt{font-size:13px;font-weight:600;fill:#111827;stroke:rgba(255,255,255,.95);stroke-width:2.6px;paint-order:stroke;pointer-events:none}
.mt.ct{font-size:14.5px;font-weight:800}
.z0 .mt[data-z="1"],.z0 .mt[data-z="2"],.z1 .mt[data-z="2"]{display:none}
.scale{display:grid;grid-template-columns:38px 1fr;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--sh)}
.vbar{position:relative;width:36px;height:340px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#f87171,#dc2626);box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.vg{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#15803d,#4ade80);transition:height .7s cubic-bezier(.3,.9,.3,1)}
.vbar i{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.55)}
.vbar b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.gl{font-size:12px;font-weight:700;margin:10px 0 4px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:4px;max-height:120px;overflow:auto}
.chp{font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;display:inline-block}.chp.g{background:#16a34a}.chp.r{background:#dc2626}
@media(max-width:860px){.ezm{grid-template-columns:1fr}}
.gt{width:100%}.gt th{background:var(--card);font-size:13px;color:var(--mu)}
.gt td{padding:4px 5px}.gt th:first-child,.gt td:first-child{position:static;background:transparent;text-align:center;color:var(--mu);width:34px}
.gt input,.gt select{min-width:125px;padding:9px 10px}.gt td:nth-child(2) input{min-width:200px}
.gt tr:nth-child(even) td{background:rgba(127,127,160,.07)}
.gt td.nok{background:rgba(34,197,94,.28)!important;box-shadow:inset 4px 0 0 #16a34a}.gt td.nok input{background:transparent;font-weight:700}
.sv{position:sticky;bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;margin-top:14px;border-radius:16px;background:var(--card);border:1px solid var(--bd);box-shadow:0 8px 28px rgba(0,0,0,.18)}
select.gs{font-weight:700;max-width:100%}
select.gs.ok{background:#16a34a;color:#fff;border-color:#16a34a}
select.gs.bad{background:#dc2626;color:#fff;border-color:#dc2626}
td.nok{background:rgba(34,197,94,.25)!important;font-weight:700;box-shadow:inset 4px 0 0 #16a34a}
.adx{position:relative;overflow:hidden;border-radius:26px;padding:22px;background:radial-gradient(rgba(127,127,160,.2) 1px,transparent 1.5px) 0 0/22px 22px,radial-gradient(600px 320px at 8% 0,rgba(124,58,237,.38),transparent),radial-gradient(520px 320px at 100% 25%,rgba(249,115,22,.32),transparent),radial-gradient(520px 320px at 25% 100%,rgba(236,72,153,.28),transparent),var(--bg);box-shadow:var(--sh)}
.adx::before,.adx::after{content:"";position:absolute;border-radius:50%;filter:blur(55px);opacity:.4;animation:fl 10s ease-in-out infinite}
.adx::before{width:240px;height:240px;background:linear-gradient(135deg,#a78bfa,#f472b6);top:-70px;right:-50px}
.adx::after{width:220px;height:220px;background:linear-gradient(135deg,#fb923c,#fbbf24);bottom:-70px;left:-40px;animation-delay:-5s}
.adx>*{position:relative;z-index:1}
.adx .panel{background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(10px)}
.ah{margin:0 0 16px;font-size:26px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:in .3s}
.mb p{margin:14px 0 4px;font-weight:600}
.x .ic{margin:0;width:17px;height:17px}
.warn{background:#fef3c7;color:#78350f;padding:10px 16px;text-align:center;font-size:14px;position:sticky;top:0;z-index:20}
.av{position:relative}
.dot{position:absolute;right:0;bottom:0;width:15px;height:15px;border-radius:50%;background:#9aa3c7;border:3px solid var(--card);z-index:2}
.dot.on{background:#22c55e;animation:onl 2s infinite}
@keyframes onl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.st.on{color:#16a34a}.st.off{color:var(--mu)}
.si{width:11px;height:11px}
.gi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;flex:none}.gi .ic{margin:0;width:22px;height:22px}
.chat{display:grid;grid-template-columns:290px 1fr;background:var(--card);border:1px solid var(--bd);border-radius:22px;overflow:hidden;box-shadow:var(--sh);height:min(620px,75vh)}
.clist{border-right:1px solid var(--bd);overflow-y:auto}

.ub{margin-left:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:12px;min-width:20px;text-align:center;padding:1px 6px}
.cmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.chead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--bd)}

 const rows=tx.split(/\r?\n/).filter(x=>x.trim()).map(x=>x.split("\t")),r0=+t.dataset.r,c0=+t.dataset.c;

 if((dr[dr.length-1].ad||"").trim())dr.push(nr());dirty=true;fa=[r0,c0];render();});
